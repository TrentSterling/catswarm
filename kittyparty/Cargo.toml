[package]
name = "kittyparty"
version = "0.1.0"
edition = "2021"
description = "A white kitty that follows your mouse while cat pictures rain down like confetti"
authors = ["trent"]
license = "MIT"
build = "build.rs"

# Standalone crate; keep it out of the catswarm build.
[workspace]

[dependencies]
wgpu = "27"
wgpu-types = "27"
winit = { version = "0.30", features = ["rwh_06"] }
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
fastrand = "2"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
ureq = "2"
serde_json = "1"
half = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
